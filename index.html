<body>
  <div class="container">
    <div class="player-toggle" role="tablist" aria-label="Выбор плеера">
      <div class="toggle-container">
        <button type="button" role="tab" class="toggle-button" data-player="radio" aria-selected="true"
          tabindex="0">Радиоплейер</button>
        <button type="button" role="tab" class="toggle-button" data-player="video" aria-selected="false"
          tabindex="-1">Видеоплейер</button>
      </div>
    </div>
    <div class="player-container">
      <h1 class="player-title">Авторадио</h1>
      <!-- Radio -->
      <div class="radio player" role="tabpanel" aria-labelledby="radio-tab">
        <button id="playButton" class="play-btn" aria-label="Воспроизвести" title="Воспроизвести/Пауза">
          <span aria-hidden="true">▶</span>
        </button>
        <div class="controls-container">
          <button id="muteButton" class="volume-btn" aria-label="Отключить звук" title="Отключить/Включить звук">
            <i class="fas fa-volume-up" aria-hidden="true"></i>
          </button>
          <div class="volume-slider-container">
            <label for="volumeSlider" class="sr-only">Громкость</label>
            <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="1"
              aria-label="Регулятор громкости">
          </div>
        </div>

        <div class="status-indicators" role="group" aria-label="Индикаторы состояния">
          <div id="networkStatus" class="status-indicator">
            <div class="status-dot" aria-hidden="true"></div>
            <div class="status-text">Сеть</div>
          </div>
          <div id="playStatus" class="status-indicator playing">
            <div class="status-dot" aria-hidden="true"></div>
            <div class="status-text">Воспроизведение</div>
          </div>
          <div id="soundStatus" class="status-indicator">
            <div class="status-dot" aria-hidden="true"></div>
            <div class="status-text">Звук</div>
          </div>
        </div>
        <!-- /Radio -->
      </div>

      <!-- Video   -->
      <div class="video player" role="tabpanel" aria-labelledby="video-tab" hidden></div>
      <!-- /Video -->
    </div>
  </div>
  <audio id="radioPlayer" style="display: none;" preload="none" playsinline webkit-playsinline
    aria-label="Аудиоплеер"></audio>

  <div id="toast" class="toast" role="alert" aria-live="polite"></div>

  <button id="debugButton"
    style="position: fixed; bottom: 10px; right: 10px; width: 40px; height: 40px; border-radius: 50%; background: rgba(0,0,0,0.3); border: none; color: white; font-size: 20px; cursor: pointer; z-index: 9999; display: none;"
    title="Открыть логи" aria-label="Открыть журнал отладки" onclick="window.showRadioLogs()">🔍</button>

  <script type="module" src="/src/main.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => {
            // console.log('Service Worker зарегистрирован с областью:', registration.scope);
          })
          .catch(error => {
            console.error('Ошибка регистрации Service Worker:', error);
          });
      });
    }

    // Включить кнопку отладки через консоль: window.enableDebugButton()
    window.enableDebugButton = () => {
      const btn = document.getElementById('debugButton');
      if (btn) {
        btn.style.display = 'block';
        console.log('🔍 Debug button enabled! Click to view logs');
      }
    };
  </script>
</body>

</html>
